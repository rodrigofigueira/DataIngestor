services:
  postgres:
    image: postgres:17
    container_name: data-ingestor-postgres
    environment:
      POSTGRES_DB: data_ingestor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: